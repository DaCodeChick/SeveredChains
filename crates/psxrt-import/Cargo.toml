[package]
name = "psxrt-import"
description = "Import-side readers for original-format PSX containers and codecs. Format-generic: no game filenames, no toolchain conventions, and no writer that would let a test agree with itself."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true

[dev-dependencies]
# TD-19: a named, pinned PRNG for generated tests. proptest's default engine is rand_chacha's
# ChaCha with a fixed start seed, which is what that decision asks for.
proptest = "1.12.0"

[lints]
workspace = true
