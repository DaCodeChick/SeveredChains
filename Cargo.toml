[workspace]
resolver = "3"
members = ["crates/psxrt", "crates/psxrt-compat", "crates/psxrt-import"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[workspace.dependencies]
# Domain error enums live in the crate that defines the domain, not in `psxrt` (TD-25).
thiserror = "2.0.21"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
